<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        div{
            width: 200px;
            height: 280px;
            border: black solid;
            border-radius: 15px;
        }
        .l{
            float:right ;
         padding-right: 40px;
         padding-top: 20px;
         font-size: 50px;
         color: red;
        }
        .r{
            float:left;
         padding-left: 30px;
         padding-top: 20px;
         font-size: 50px;
         color: red;
        }
        .c{
            position: relative;
            top: 120px;
            right: -20px;
            font-size: 50px;
            color: red;
            
        }
        .d{
            position: relative;
            bottom: -230px;
            transform: rotate(180deg);
            float: left;
        
            right: 10px;
            font-size:  50px;
color: red;
                 
        }
        
    </style>
</head>
<body>
   
   <div> 
    <span class="r"> &hearts;</span>
    <span class="l"> &hearts;</span>
    <span class="c"> &hearts;</span>
    <span class="d">&hearts;</span>









   </div>
</body>
</html>
